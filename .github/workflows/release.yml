name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for rehearsing a release"
        required: true

# Only the job that creates the release may write to the repository. The
# compiler, the cache, and the cross-build containers all run untrusted-ish
# third-party code against a checkout; none of them need that power.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Which tag is being released is not obvious: on a manual run `ref_name` is
  # the branch the workflow was launched from, not the tag. Resolving it once,
  # and refusing anything that does not match the crate version, keeps every
  # later job from guessing.
  resolve:
    name: resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: choose the tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag='${{ inputs.tag }}'
          else
            tag='${{ github.ref_name }}'
          fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::expected a tag like v1.2.3, got '$tag'"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: tag must match the crate version
        shell: bash
        run: |
          set -euo pipefail
          crate=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tag='${{ steps.tag.outputs.tag }}'
          if [ "v$crate" != "$tag" ]; then
            echo "::error::$tag does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "releasing $tag"

  build:
    name: ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl is the one that matters for `curl | bash`: it links statically,
          # so it runs on any glibc, including distributions older than the
          # runner that built it.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `cross` builds inside a container that already has the right linker and
      # C toolchain, which rusqlite's bundled SQLite needs for a foreign target.
      - name: install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: build
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          name="buzztui-${{ needs.resolve.outputs.tag }}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/buzztui" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Checksums sit next to the artefact so the installer can verify a
          # download without trusting the transport alone.
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: publish release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: collect checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm -f ./*.sha256
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          draft: false
          generate_release_notes: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
